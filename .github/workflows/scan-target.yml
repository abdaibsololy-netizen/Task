name: "Security Scan — فحص الهدف المنشور"

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "الرابط المستهدف (يتجاوز الملف security/scan_target.txt)"
        required: false
        default: ""
      mode:
        description: "نطاق الفحص"
        required: false
        default: "full"
        type: choice
        options: [full, quick, probe-only, secrets-only]

permissions:
  contents: write

concurrency:
  group: sec-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_FILE: security/scan_target.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تحديد الهدف والنطاق
        id: cfg
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target }}"
          MODE="${{ inputs.mode }}"
          [ -n "$TARGET" ] || { [ -f "$TARGET_FILE" ] && TARGET="$(tr -d '\r\n' < "$TARGET_FILE")"; }
          MODE="${MODE:-full}"
          [ -n "$TARGET" ] || { echo "no target configured" >&2; exit 1; }
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "🎯 الهدف: ${TARGET} | النطاق: ${MODE}"

      - name: تثبيت الأدوات
        run: pip install -q -r security/requirements.txt

      - name: الفحص العام (TLS/ترويسات/كوكيز/CORS/مسارات/IDOR …)
        if: steps.cfg.outputs.mode == 'full' || steps.cfg.outputs.mode == 'quick'
        run: |
          if [ "${{ steps.cfg.outputs.mode }}" = "quick" ]; then
            python security/audit.py "${{ steps.cfg.outputs.target }}" --out security/findings --skip-active
          else
            python security/audit.py "${{ steps.cfg.outputs.target }}" --out security/findings --timeout 12
          fi

      - name: فحوص الحقن (SQLi/XSS/traversal/cmd/SSTI/SSRF/CRLF)
        if: steps.cfg.outputs.mode == 'full' || steps.cfg.outputs.mode == 'probe-only'
        run: |
          python security/probe.py "${{ steps.cfg.outputs.target }}" --out security/findings --timeout 12

      - name: أسرار مسرّبة داخل الموقع
        if: steps.cfg.outputs.mode == 'full' || steps.cfg.outputs.mode == 'secrets-only'
        run: |
          python security/secrets_scan.py --url "${{ steps.cfg.outputs.target }}" --out security/findings

      - name: تجميع الملخص
        if: always()
        run: |
          {
            echo "## 🔐 نتيجة الفحص — ${{ steps.cfg.outputs.target }}"
            echo ""
            python - <<'PY'
          import glob, json, os
          for f in sorted(glob.glob("security/findings/*.json")):
              if f.endswith("bandit.json"):
                  continue
              try:
                  d = json.load(open(f))
              except Exception:
                  continue
              if "summary" not in d:
                  continue
              print(f"### {os.path.basename(f)}")
              print("الملخص:", json.dumps(d.get("summary", {}), ensure_ascii=False))
              for x in d.get("findings", [])[:60]:
                  tgt = x.get("target") or x.get("where", "")
                  print(f"- **{x.get('severity','?').upper()}** `{x.get('id','')}` {x.get('title','')} → `{tgt}`")
              print()
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: حفظ النتائج في فرع scan-results
        if: always()
        run: |
          git config user.name "arena-scan"
          git config user.email "scan@users.noreply.github.com"
          git add -f security/findings || true
          git commit -q -m "scan results: ${{ steps.cfg.outputs.target }} @ $(date -u +%FT%TZ)" || true
          git push --force origin HEAD:scan-results

      - name: رفع التقارير (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ github.run_number }}
          path: security/findings/
          retention-days: 30
