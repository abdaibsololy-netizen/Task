name: "Alpha 24/7 — فحص الفرص"

on:
  schedule:
    - cron: "*/5 * * * *"   # كل 5 دقائق على مدار الساعة (مجاني — مستودع عام)
  workflow_dispatch:          # تشغيل يدوي للاختبار

permissions:
  contents: read

concurrency:
  group: alpha-alert
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: استرجاع حالة التنبيهات (منع التكرار)
        uses: actions/cache@v4
        with:
          path: bot/.alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: فحص الفرصة وإرسال التنبيه
        run: python bot/alert_loop.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: حفظ الحالة
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/.alert_state.json
          key: alert-state-${{ github.run_id }}
